# Application Name
spring.application.name=photography-portfolio

# Server Configuration
server.port=8181

# ========================================
# MongoDB Configuration (for photos)
# ========================================
# Using MongoDB Atlas for photo storage
spring.data.mongodb.uri=${MONGODB_URI}

# Local MongoDB config (commented out)
# spring.data.mongodb.host=localhost
# spring.data.mongodb.port=27017
# spring.data.mongodb.database=photography_portfolio

# ========================================
# SQL Database Configuration (for user authentication)
# ========================================

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:photography_portfolio_users}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ========================================
# Azure Blob Storage Configuration
# ========================================
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER_NAME:images}
azure.storage.account-name=${AZURE_STORAGE_ACCOUNT_NAME}

# ========================================
# JWT Configuration
# ========================================
jwt.secret=${JWT_SECRET:your-secret-key-change-this-in-production-make-it-long-and-random-at-least-256-bits}
jwt.expiration=86400000
# 86400000 ms = 24 hours

# ========================================
# File Upload Configuration
# ========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ========================================
# Jackson Configuration (JSON serialization)
# ========================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# ========================================
# Logging Configuration
# ========================================
logging.level.root=INFO
logging.level.com.portfolio=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
