# Application Name
spring.application.name=photography-portfolio

# Server Configuration
server.port=8181

# MongoDB Configuration
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=photography_portfolio

# Optional: If using MongoDB Atlas or authentication
# spring.data.mongodb.uri=mongodb://username:password@host:port/database
# spring.data.mongodb.authentication-database=admin

# Logging Configuration
logging.level.root=INFO
logging.level.com.portfolio=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG

# File Upload Configuration (for photo uploads)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Jackson Configuration (JSON serialization)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
