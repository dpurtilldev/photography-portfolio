# Test Application Properties
spring.application.name=photography-portfolio-test

# MongoDB Test Configuration - Using Embedded MongoDB
# The embedded MongoDB will automatically start on a random port
spring.data.mongodb.database=photography_portfolio_test

# Enable embedded MongoDB for tests
de.flapdoodle.mongodb.embedded.version=6.0.5

# Logging Configuration for Tests
logging.level.root=INFO
logging.level.com.portfolio=DEBUG
logging.level.org.springframework=WARN
logging.level.org.springframework.data.mongodb=WARN

# Disable DevTools in tests
spring.devtools.restart.enabled=false

# File Upload Configuration (for tests)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
